<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASSET//HUB — 免费游戏素材控制台 v22</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          cyber: {
            bg: '#05060a', panel: '#0c0e17', panel2: '#0f1220', panel3: '#131728',
            line: '#191d2c', line2: '#252b3f', text: '#c4ccd8', dim: '#5a6379', dim2: '#343b4e',
            cyan: '#00f0ff', magenta: '#ff2e88', lime: '#c6ff00', violet: '#a78bfa', amber: '#ffb800', gold: '#ffd166', danger: '#ff3333'
          }
        },
        fontFamily: { display: ['Chakra Petch', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
        boxShadow: {
          'cyber-cyan': '0 0 16px rgba(0,240,255,.45), inset 0 0 10px rgba(255,255,255,.25)',
          'cyber-lime': '0 0 16px rgba(198,255,0,.4), inset 0 0 10px rgba(255,255,255,.25)',
          'cyber-magenta': '0 0 16px rgba(255,46,136,.45), inset 0 0 10px rgba(255,255,255,.2)'
        }
      }
    }
  }
</script>

<style>
  body { font-family: 'Chakra Petch', system-ui, sans-serif; background: #05060a; color: #c4ccd8; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  ::selection { background: rgba(0,240,255,.28); color: #fff; }

  .grid-floor { position: fixed; bottom: 0; left: 0; right: 0; height: 65vh; background-image: linear-gradient(to right, rgba(0,240,255,.055) 1px, transparent 1px), linear-gradient(to bottom, rgba(0,240,255,.055) 1px, transparent 1px); background-size: 64px 64px; transform: perspective(280px) rotateX(62deg); transform-origin: bottom center; mask-image: linear-gradient(to top, #000 0%, transparent 85%); -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 85%); pointer-events: none; z-index: 0; opacity: 0.55; }
  .glow-orb { position: fixed; top: -20vh; left: 20%; width: 60vw; height: 60vh; background: radial-gradient(circle, rgba(0,240,255,.07), transparent 65%); pointer-events: none; z-index: 0; filter: blur(40px); }
  .glow-orb.pink { left: auto; right: 0; top: auto; bottom: -20vh; background: radial-gradient(circle, rgba(255,46,136,.055), transparent 65%); }
  .noise { position: fixed; inset: 0; pointer-events: none; z-index: 9997; opacity: 0.028; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); mix-blend-mode: overlay; }
  body::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9998; background: repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px); opacity: 0.3; mix-blend-mode: multiply; }

  .title-glitch { position: relative; user-select: none; width: max-content; text-shadow: 0 0 40px rgba(0,240,255,.22); }
  .title-glitch::before, .title-glitch::after { content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; }
  .title-glitch::before { color: #ff2e88; opacity: 0.55; clip-path: inset(0 0 62% 0); animation: glitch-a 4.2s infinite steps(1); }
  .title-glitch::after { color: #00f0ff; opacity: 0.55; clip-path: inset(58% 0 0 0); animation: glitch-b 4.2s infinite steps(1); }
  @keyframes glitch-a { 0%, 86%, 100% { transform: translate(0); } 88% { transform: translate(-2px, -1px); } 90% { transform: translate(2px, 1px); } 92% { transform: translate(-1px, 0); } 94% { transform: translate(1px, -1px); } }
  @keyframes glitch-b { 0%, 86%, 100% { transform: translate(0); } 89% { transform: translate(2px, 1px); } 91% { transform: translate(-2px, -1px); } 93% { transform: translate(1px, 1px); } 95% { transform: translate(-1px, 0); } }

  /* 增加 select-none 防止拖拽时文字被选中 */
  .cyber-card { position: relative; background: linear-gradient(152deg, #10131f 0%, #0a0c15 100%); border: 1px solid #191d2c; transition: all 0.18s cubic-bezier(.22,.68,.32,1); isolation: isolate; overflow: hidden; user-select: none; }
  .cyber-card::before, .cyber-card::after { content: ''; position: absolute; width: 13px; height: 13px; border-color: #00f0ff; border-style: solid; opacity: 0; transition: opacity 0.2s, border-color 0.2s; pointer-events: none; z-index: 2; }
  .cyber-card::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .cyber-card::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
  .cyber-card:hover::before, .cyber-card:hover::after { opacity: 1; }
  .cyber-card:hover { border-color: rgba(0,240,255,.42); transform: translateY(-3px); box-shadow: 0 10px 34px rgba(0,0,0,.55), 0 0 34px rgba(0,240,255,.07); }
  .cyber-card[data-lic="free-commercial"]:hover { border-color: rgba(198,255,0,.42); box-shadow: 0 10px 34px rgba(0,0,0,.55), 0 0 34px rgba(198,255,0,.07); }
  .cyber-card[data-lic="cc-by"]:hover { border-color: rgba(255,184,0,.42); box-shadow: 0 10px 34px rgba(0,0,0,.55), 0 0 34px rgba(255,184,0,.07); }
  .cyber-card[data-lic="mixed"]:hover { border-color: rgba(255,46,136,.42); box-shadow: 0 10px 34px rgba(0,0,0,.55), 0 0 34px rgba(255,46,136,.07); }

  .card-spotlight { position: absolute; inset: 0; pointer-events: none; z-index: 0; opacity: 0; transition: opacity .25s; background: radial-gradient(320px circle at var(--mx,50%) var(--my,50%), rgba(0,240,255,.075), transparent 45%); }
  .cyber-card:hover .card-spotlight { opacity: 1; }
  .card-anim { animation: cardIn 0.42s cubic-bezier(.22,.68,.32,1) both; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(12px) scale(.985); } to { opacity: 1; transform: none; } }

  mark.hl { background: rgba(0,240,255,.18); color: #00f0ff; padding: 0 2px; border-radius: 1px; border-bottom: 1px solid #00f0ff; text-shadow: 0 0 8px rgba(0,240,255,.5); }

  .empty-hud-panel { position: relative; background: rgba(12, 14, 23, 0.85); border: 1px solid var(--line); padding: 20px 24px; width: 100%; max-width: 320px; backdrop-filter: blur(8px); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4); }
  .empty-hud-panel::before, .empty-hud-panel::after, .empty-hud-panel .corner-bl, .empty-hud-panel .corner-br { content: ''; position: absolute; width: 8px; height: 8px; border-color: var(--magenta); border-style: solid; pointer-events: none; }
  .empty-hud-panel::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .empty-hud-panel::after { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
  .empty-hud-panel .corner-bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
  .empty-hud-panel .corner-br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #252b3f; border-radius: 4px; border: 2px solid #05060a; }
  ::-webkit-scrollbar-thumb:hover { background: #2f374d; }
  [x-cloak] { display: none !important; }

  .btn-random-group:hover .random-icon { transform: rotate(180deg) scale(1.1); }
  .random-icon { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

  .context-card { -webkit-touch-callout: none; user-select: none; }

  .is-dragging {
    opacity: 0.25 !important;
    border-color: var(--cyan) !important;
    box-shadow: 0 0 20px var(--cyan) !important;
    transform: scale(0.98) !important;
  }
  .drag-target {
    border-color: var(--cyan) !important;
    background: rgba(0,240,255,0.08) !important;
    transform: scale(1.02) !important;
    box-shadow: 0 0 30px rgba(0,240,255,0.2) !important;
  }
</style>
</head>

<body x-data="assetHub()" x-init="init()" @click="closeContextMenu">
  <div class="grid-floor"></div><div class="glow-orb"></div><div class="glow-orb pink"></div><div class="noise"></div>

  <div class="relative z-10 grid grid-cols-1 lg:grid-cols-[272px_1fr] max-w-[1540px] mx-auto min-h-screen">

    <aside class="sticky top-0 h-screen flex flex-col gap-6 p-6 border-r border-cyber-line bg-gradient-to-b from-[rgba(12,14,23,0.72)] to-[rgba(5,6,10,0.4)] backdrop-blur-md overflow-y-auto overflow-x-hidden">
      <div class="flex flex-col gap-2 shrink-0">
        <div class="flex items-center gap-2.5">
          <div class="w-[11px] h-[11px] bg-cyber-cyan shadow-[0_0_14px_#00f0ff,0_0_28px_rgba(0,240,255,0.4)] animate-pulse" style="clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);"></div>
          <span class="font-display text-[19px] font-bold tracking-tight text-white">ASSET<span class="text-cyber-magenta italic">//</span>HUB</span>
          <span class="ml-auto font-mono text-[9.5px] text-cyber-dim tracking-widest border border-cyber-line2 px-1.5 py-0.5 rounded-sm">v22</span>
        </div>
        <div class="font-mono text-[10px] text-cyber-dim2 tracking-[0.18em] uppercase">free game asset console</div>
      </div>

      <div x-show="recentSites.length > 0" x-cloak class="flex flex-col gap-2 shrink-0">
        <div class="flex items-center justify-between font-mono text-[10.5px] text-cyber-dim uppercase tracking-widest">
          <span class="text-cyber-text font-semibold normal-case">最近访问</span>
          <button @click="clearRecent" class="hover:text-cyber-magenta transition-colors p-1" title="清空"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
        </div>
        <div class="flex flex-wrap gap-1.5">
          <template x-for="site in recentSites" :key="site.url">
            <button @click="window.open(site.url, '_blank')" class="font-mono text-[10px] text-cyber-dim bg-white/5 border border-cyber-line rounded-sm px-2 py-1 hover:text-cyber-cyan hover:border-cyber-cyan/30 transition-colors" x-text="site.name"></button>
          </template>
        </div>
      </div>

      <template x-for="group in filterDefs" :key="group.key">
        <div class="flex flex-col gap-2.5 shrink-0">
          <div class="flex items-center font-mono text-[10.5px] uppercase tracking-widest text-cyber-dim">
            <span class="text-cyber-text font-semibold tracking-normal" x-text="group.cn"></span>
            <div class="flex-1 h-px ml-2.5 bg-gradient-to-r from-cyber-line2 to-transparent"></div>
          </div>
          <div class="flex flex-wrap gap-1.5">
            <template x-for="(label, val) in group.opts" :key="val">
              <button @click="toggleFilter(group.key, val)" :class="{ 'bg-cyber-cyan border-cyber-cyan text-[#02181a] font-bold shadow-cyber-cyan': activeFilters[group.key].includes(val) && group.key === 'types', 'bg-cyber-lime border-cyber-lime text-[#0e1400] font-bold shadow-cyber-lime': activeFilters[group.key].includes(val) && group.key === 'licenses', 'bg-cyber-magenta border-cyber-magenta text-white font-bold shadow-cyber-magenta': activeFilters[group.key].includes(val) && group.key === 'registers', 'bg-transparent border-cyber-line text-cyber-dim hover:border-cyber-line2 hover:text-cyber-text hover:bg-white/5': !activeFilters[group.key].includes(val) }" class="font-mono text-[11px] border rounded-sm px-2 py-1 flex items-center gap-1.5 transition-all duration-150 active:scale-95">
                <span x-text="label"></span><span class="text-[9px] px-1 rounded-sm bg-black/20" x-text="getCount(group.key, val)"></span>
              </button>
            </template>
          </div>
        </div>
      </template>

      <button @click="favOnly = !favOnly" :class="favOnly ? 'text-cyber-gold border-cyber-gold/40 bg-cyber-gold/5 shadow-[0_0_16px_rgba(255,209,102,0.1)]' : 'text-cyber-dim border-cyber-line hover:border-cyber-line2 hover:text-cyber-text hover:bg-white/5'" class="flex items-center justify-between w-full px-3 py-2 border rounded-sm font-mono text-[11px] transition-all shrink-0 mt-auto">
        <span class="flex items-center gap-2"><span class="text-[13px]" :class="favOnly ? 'text-cyber-gold' : ''">★</span><span>只看收藏</span></span><span class="text-[10px] bg-white/5 px-1.5 py-0.5 rounded-sm" x-text="favorites.length"></span>
      </button>
    </aside>

    <main class="flex flex-col p-6 lg:p-8 pb-16 min-w-0">
      <header class="flex flex-col gap-5 mb-6 shrink-0 relative z-20">
        <div class="flex items-end justify-between flex-wrap gap-5">
          <div class="flex flex-col gap-1.5">
            <h1 class="title-glitch font-display text-[clamp(30px,4.4vw,48px)] font-bold tracking-tighter text-white leading-none" data-text="ASSET//HUB">ASSET<span class="text-cyber-magenta drop-shadow-[0_0_24px_rgba(255,46,136,0.7)]">//</span>HUB</h1>
            <div class="font-mono text-[11px] text-cyber-dim tracking-widest flex items-center gap-2">
              <div class="w-5 h-px bg-cyber-dim2"></div>
              高质量免费游戏素材 · 离线单文件 · <b class="text-cyber-cyan font-medium" x-text="sites.length"></b> 个站点
            </div>
          </div>
        </div>

        <div class="flex gap-2.5 items-stretch">
          <div class="relative flex-1 flex items-center gap-3 h-[50px] px-4 bg-gradient-to-b from-cyber-panel2 to-cyber-panel border border-cyber-line rounded-sm transition-all group focus-within:border-cyber-cyan/50 focus-within:shadow-[0_0_30px_rgba(0,240,255,0.07)] cursor-text" @click="$refs.searchInput.focus()">
            <div class="absolute left-0 top-0 w-[3px] h-full bg-cyber-cyan shadow-[0_0_12px_#00f0ff] opacity-0 transition-opacity rounded-l-sm group-focus-within:opacity-100"></div>
            <svg class="w-[15px] h-[15px] text-cyber-dim group-focus-within:text-cyber-cyan transition-colors shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/></svg>
            <input x-ref="searchInput" x-model="search" @keydown.escape="search=''" type="text" placeholder="搜索站点 (支持空格分词，按 Enter 打开首个)…" class="flex-1 min-w-0 bg-transparent border-none outline-none text-white font-mono text-[13.5px] tracking-wide placeholder:text-cyber-dim2" autocomplete="off" spellcheck="false">

            <button x-show="search.length > 0" @click.stop="search=''" class="text-cyber-dim hover:text-cyber-magenta p-1 shrink-0"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>

            <button @click.stop="openCmdPalette('cmd')" class="ml-1 flex items-center gap-1.5 px-2 py-1 bg-black/25 border border-cyber-line2 rounded-sm text-cyber-dim hover:text-cyber-cyan hover:border-cyber-cyan/40 transition-colors shrink-0 group-focus-within:border-cyber-cyan/40" title="打开命令面板">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3H6a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3 3 3 0 0 0-3 3 3 3 0 0 0 3 3h12a3 3 0 0 0 3-3 3 3 0 0 0-3-3z"/></svg>
              <span class="font-mono text-[10px] tracking-wider hidden sm:inline-block">Ctrl K</span>
            </button>
            <kbd class="font-mono text-[10px] text-cyber-dim2 border border-cyber-line2 rounded-sm px-1.5 py-0.5 shrink-0 group-focus-within:hidden sm:hidden">/</kbd>
          </div>

          <button type="button" @click="openRandom" class="btn-random-group flex items-center justify-center w-[50px] h-[50px] bg-gradient-to-b from-[rgba(255,46,136,0.09)] to-[rgba(255,46,136,0.04)] border border-cyber-magenta/30 rounded-sm text-cyber-magenta hover:from-[rgba(255,46,136,0.18)] hover:to-[rgba(255,46,136,0.08)] hover:border-cyber-magenta hover:shadow-[0_0_24px_rgba(255,46,136,0.25)] hover:bg-[rgba(255,46,136,0.1)] active:scale-95 transition-all shrink-0" title="随机发现 (R)">
            <svg class="w-[18px] h-[18px] random-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
          </button>
        </div>

        <div class="flex items-center gap-3 flex-wrap p-2.5 bg-gradient-to-b from-[rgba(15,18,32,0.55)] to-[rgba(12,14,23,0.55)] border border-cyber-line rounded-sm backdrop-blur-sm">
          <div class="flex items-center gap-1.5 overflow-x-auto pb-1 sm:pb-0 w-full sm:w-auto">
            <span class="font-mono text-[9.5px] text-cyber-dim2 tracking-widest px-1 uppercase">预设</span>
            <button @click="applyPreset({ lic: ['cc0','free-commercial'], reg: ['none'] })" class="whitespace-nowrap font-mono text-[10px] bg-cyber-cyan/10 text-cyber-cyan border border-cyber-cyan/20 px-2 py-1 rounded-sm hover:bg-cyber-cyan/20 transition-colors">🚀 直接商用</button>
            <button @click="applyPreset({ type: ['2d'] })" class="whitespace-nowrap font-mono text-[10px] bg-cyber-lime/10 text-cyber-lime border border-cyber-lime/20 px-2 py-1 rounded-sm hover:bg-cyber-lime/20 transition-colors">🎨 2D 美术</button>
            <button @click="applyPreset({ type: ['audio'] })" class="whitespace-nowrap font-mono text-[10px] bg-cyber-magenta/10 text-cyber-magenta border border-cyber-magenta/20 px-2 py-1 rounded-sm hover:bg-cyber-magenta/20 transition-colors">🔊 音频音效</button>
          </div>
          <div class="w-px h-[18px] bg-cyber-line2 mx-0.5 hidden sm:block"></div>

          <!-- 排序按钮，加了 clearDragState -->
          <div class="flex items-center gap-0.5 p-0.5 bg-black/25 border border-cyber-line rounded-sm">
            <template x-for="s in [{k:'rec', l:'推荐'}, {k:'az', l:'A-Z'}]" :key="s.k">
              <button @click="sort = s.k; currentPage = 1; clearDragState()" :class="sort === s.k ? 'bg-cyber-cyan text-[#02181a] font-bold shadow-[0_0_10px_rgba(0,240,255,0.3)]' : 'text-cyber-dim hover:text-cyber-text hover:bg-white/5'" class="font-mono text-[10.5px] px-2.5 py-1 rounded-sm transition-all" x-text="s.l"></button>
            </template>
          </div>

          <!-- 视图切换按钮，加了 clearDragState -->
          <div class="flex items-center gap-0.5 p-0.5 bg-black/25 border border-cyber-line rounded-sm">
            <button @click="view = 'grid'; clearDragState()" :class="view === 'grid' ? 'bg-cyber-cyan text-[#02181a] shadow-[0_0_10px_rgba(0,240,255,0.3)]' : 'text-cyber-dim hover:text-cyber-text hover:bg-white/5'" class="p-1 rounded-sm transition-all"><svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button>
            <button @click="view = 'list'; clearDragState()" :class="view === 'list' ? 'bg-cyber-cyan text-[#02181a] shadow-[0_0_10px_rgba(0,240,255,0.3)]' : 'text-cyber-dim hover:text-cyber-text hover:bg-white/5'" class="p-1 rounded-sm transition-all"><svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
          </div>

          <div class="ml-auto flex items-center gap-1.5">
            <button @click="copyAll" class="w-[30px] h-[30px] flex items-center justify-center bg-transparent border border-cyber-line rounded-sm text-cyber-dim hover:text-cyber-cyan hover:border-cyber-cyan/40 hover:bg-cyber-cyan/5 transition-all" title="复制全部"><svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
          </div>
        </div>

        <div class="relative z-30 flex items-center justify-between gap-3 flex-wrap font-mono text-[11px] tracking-wider px-0.5 min-h-[24px]">
          <div class="flex items-center gap-2 text-cyber-dim shrink-0">
            <div class="w-1.5 h-1.5 rounded-full bg-cyber-lime shadow-[0_0_10px_#c6ff00] animate-pulse"></div>
            <span>MATCH <b class="text-cyber-lime font-medium" x-text="totalSites"></b> <span class="text-cyber-dim2">/</span> <span x-text="sites.length"></span></span>
          </div>
          <div class="flex-1 flex flex-wrap justify-center gap-1.5">
            <template x-for="(vals, key) in activeFilters" :key="key">

      </header>

      <div class="flex-1 relative flex flex-col">
        <div x-show="displayedSites.length > 0" :class="view === 'grid' ? 'grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-3' : 'flex flex-col gap-1.5'" class="transition-all duration-300">

          <template x-for="(site, i) in displayedSites" :key="site.url">
            <a :href="site.url" target="_blank" rel="noopener noreferrer"

               class="cyber-card card-anim group flex rounded-sm text-inherit no-underline context-card"

               @dragend="handleDragEnd($event)"

              <span class="card-spotlight"></span>

              <div x-show="view === 'grid'" class="flex flex-col h-full w-full relative z-10">

                <div class="flex items-center gap-2 mb-2.5 w-full">
                  <span class="font-mono text-[10px] text-cyber-dim2 tracking-widest shrink-0">// <b class="text-cyber-dim" x-text="String((currentPage - 1) * pageSize + i + 1).padStart(2, '0')"></b></span>

                  <div class="ml-auto flex items-center gap-1 overflow-hidden justify-end">
                    <span x-show="site.isNew" class="font-mono text-[8.5px] font-bold tracking-wider bg-cyber-violet/15 text-cyber-violet border border-cyber-violet/30 rounded-sm px-1.5 py-0.5 shrink-0">NEW</span>
                    <span x-show="site.featured" class="font-mono text-[8.5px] font-bold tracking-wider bg-cyber-gold/15 text-cyber-gold border border-cyber-gold/30 rounded-sm px-1.5 py-0.5 shrink-0">★ 推荐</span>
                    <span :class="{ 'bg-[rgba(0,240,255,0.14)] text-cyber-cyan border-[rgba(0,240,255,0.3)]': site.license === 'cc0', 'bg-[rgba(255,184,0,0.13)] text-cyber-amber border-[rgba(255,184,0,0.3)]': site.license === 'cc-by', 'bg-[rgba(198,255,0,0.12)] text-cyber-lime border-[rgba(198,255,0,0.28)]': site.license === 'free-commercial', 'bg-[rgba(255,46,136,0.12)] text-cyber-magenta border-[rgba(255,46,136,0.28)]': site.license === 'mixed' }" class="font-mono text-[9.5px] font-bold tracking-wider border rounded-sm px-1.5 py-0.5 whitespace-nowrap shrink-0" x-text="LICENSE_LABEL[site.license]"></span>

                  <div class="flex items-center gap-1 shrink-0 ml-1 pl-1.5 border-l border-cyber-line2">
                    <button @click.prevent.stop="toggleFav(site)" :class="favorites.includes(site.url) ? 'text-cyber-gold' : 'text-cyber-dim2 hover:text-cyber-gold'" class="w-[22px] h-[22px] flex items-center justify-center rounded-sm hover:bg-cyber-gold/10 transition-colors p-0"><svg class="w-3.5 h-3.5" viewBox="0 0 24 24" :fill="favorites.includes(site.url) ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>

                    <button @click.prevent.stop="openContextMenu($event, site)" class="w-[22px] h-[22px] flex items-center justify-center rounded-sm text-cyber-dim2 hover:bg-cyber-cyan/20 hover:text-cyber-cyan transition-colors p-0 opacity-0 group-hover:opacity-100">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
                    </button>
                  </div>
                </div>

                <h3 class="font-display text-[16.5px] font-bold text-white leading-tight mb-1 group-hover:text-cyber-cyan transition-colors" x-html="highlight(site.name)"></h3>
                <div class="flex items-center gap-1.5 font-mono text-[10px] text-cyber-dim tracking-wide mb-2.5">
                  <span x-text="getDomain(site.url)"></span><span class="w-0.5 h-0.5 rounded-full bg-cyber-dim2"></span><span class="text-cyber-dim2" x-text="REGISTER_LABEL[site.register]"></span>
                </div>
                <p class="font-display text-[12.5px] leading-relaxed text-[#8892a4] flex-1 mb-3 line-clamp-2" x-html="highlight(site.desc)"></p>
                <div class="flex flex-wrap gap-1 mb-3.5">
                  <template x-for="t in site.types" :key="t">
                    <span @click.prevent.stop="toggleFilter('types', t)" class="font-mono text-[9.5px] tracking-wide bg-[rgba(0,240,255,0.07)] text-cyber-cyan border border-[rgba(0,240,255,0.14)] rounded-sm px-1.5 py-0.5 cursor-pointer hover:bg-[rgba(0,240,255,0.15)] hover:border-cyber-cyan transition-colors whitespace-nowrap" x-text="TYPE_LABEL[t]"></span>
                  </template>
                  <template x-for="tag in site.tags.slice(0, 3)" :key="tag">
                    <span @click.prevent.stop="search = tag" class="font-mono text-[9.5px] tracking-wide bg-white/5 text-cyber-dim border border-transparent rounded-sm px-1.5 py-0.5 whitespace-nowrap cursor-pointer hover:bg-white/10 hover:text-cyber-text transition-colors" x-text="tag"></span>
                  </template>
                </div>
                <div class="flex gap-1.5 pt-3 border-t border-white/5 opacity-0 translate-y-1 group-hover:opacity-100 group-hover:translate-y-0 transition-all">
                  <div class="flex-1 flex items-center justify-center gap-1.5 border border-cyber-line2 text-cyber-dim font-mono text-[10.5px] tracking-wider rounded-sm py-1.5 group-hover:text-cyber-cyan group-hover:border-cyber-cyan/45 group-hover:bg-cyber-cyan/5 transition-all">打开</div>
                  <button @click.prevent="copyText(site.url)" class="flex-1 flex items-center justify-center gap-1.5 border border-cyber-line2 text-cyber-dim font-mono text-[10.5px] tracking-wider rounded-sm py-1.5 hover:text-cyber-lime hover:border-cyber-lime/45 hover:bg-cyber-lime/5 transition-all">复制</button>
                </div>
              </div>

              <div x-show="view === 'list'" class="flex items-center gap-3 w-full relative z-10">
                <div class="flex items-center gap-1.5 shrink-0">
                  <span x-show="site.featured" class="w-1.5 h-1.5 rounded-full bg-cyber-gold shadow-[0_0_8px_#ffd166]" title="推荐"></span>
                  <span :class="{ 'text-cyber-cyan': site.license === 'cc0', 'text-cyber-amber': site.license === 'cc-by', 'text-cyber-lime': site.license === 'free-commercial', 'text-cyber-magenta': site.license === 'mixed' }" class="font-mono text-[9.5px] font-bold tracking-wider whitespace-nowrap" x-text="LICENSE_LABEL[site.license]"></span>
                </div>
                <h3 class="font-display text-[14px] font-bold text-white group-hover:text-cyber-cyan transition-colors min-w-[150px] truncate" x-html="highlight(site.name)"></h3>
                <div class="flex items-center gap-1.5 font-mono text-[10px] text-cyber-dim tracking-wide"><span x-text="getDomain(site.url)"></span><span class="w-0.5 h-0.5 rounded-full bg-cyber-dim2"></span><span class="text-cyber-dim2" x-text="REGISTER_LABEL[site.register]"></span></div>
                <div class="ml-auto flex items-center gap-1.5 shrink-0 opacity-0 group-hover:opacity-100 transition-opacity">
                  <button @click.prevent="toggleFav(site)" :class="favorites.includes(site.url) ? 'text-cyber-gold' : 'text-cyber-dim hover:text-cyber-gold'" class="p-1 hover:bg-cyber-gold/10 rounded-sm transition-colors"><svg class="w-3.5 h-3.5" viewBox="0 0 24 24" :fill="favorites.includes(site.url) ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>
                  <button @click.prevent="copyText(site.url)" class="p-1 text-cyber-dim hover:text-cyber-lime hover:bg-cyber-lime/10 rounded-sm transition-colors"><svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
                  <button @click.prevent.stop="openContextMenu($event, site)" class="p-1 text-cyber-dim hover:text-cyber-cyan hover:bg-cyber-cyan/10 rounded-sm transition-colors"><svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
                </div>
              </div>
            </a>
          </template>
        </div>

        <div x-show="displayedSites.length === 0" x-cloak class="flex flex-col items-center justify-center py-20 gap-4 text-center w-full flex-1">
          <div class="empty-hud-panel">
            <div class="corner-bl"></div>
            <div class="corner-br"></div>
            <div class="flex items-center justify-between border-b border-cyber-line pb-2.5 mb-3">
              <div class="flex items-center gap-2">
                <div class="w-1.5 h-1.5 rounded-full bg-cyber-magenta animate-pulse shadow-[0_0_8px_#ff2e88]"></div>
                <span class="text-[10px] text-cyber-magenta tracking-widest font-bold">SYSTEM_ALERT</span>
              </div>
              <span class="text-[10px] text-cyber-dim2">tty0</span>
            </div>
            <div class="font-mono text-[12px] leading-relaxed text-left text-cyber-text">
              <div class="text-cyber-dim2 select-none mb-1">$ query --status</div>
              <div class="text-cyber-magenta">
                <template x-if="favOnly && favorites.length === 0">
                  <span>> ERR_0x454D505459 : EMPTY_COLLECTION</span>
                </template>
                <template x-if="!favOnly || favorites.length > 0">
                  <span>> ERR_0x4E4F5F : NO_MATCH_FOUND</span>
                </template>
              </div>
              <div class="text-cyber-dim mt-1">
                <template x-if="favOnly && favorites.length === 0">
                  <span>> 收藏库为空，请先添加收藏。</span>
                </template>
                <template x-if="!favOnly || favorites.length > 0">
                  <span>> 没有匹配的条目，请检查输入。</span>
                </template>
              </div>
              <div class="mt-4 flex items-center gap-1.5 text-[10px] text-cyber-cyan">
                <span>等待输入_</span><span class="w-1.5 h-3 bg-cyber-cyan animate-pulse"></span>
              </div>
            </div>
          </div>

          <div class="font-mono text-[12px] tracking-widest text-cyber-dim mt-2">
            <template x-if="favOnly && favorites.length === 0"><span>你还没有收藏任何素材 · <button @click="favOnly = false" class="text-cyber-cyan hover:underline">返回全部</button></span></template>
            <template x-if="!favOnly || favorites.length > 0"><span>没有找到匹配的站点 · 试试 <button @click="resetAll" class="text-cyber-cyan hover:underline">放宽筛选</button> 或 <button @click="search = ''" class="text-cyber-cyan hover:underline">清空搜索</button></span></template>
          </div>
        </div>

        <div x-show="totalSites > 0" x-cloak class="mt-8 flex flex-col sm:flex-row items-center justify-between border-t border-cyber-line pt-5 gap-4 font-mono text-[11px] text-cyber-dim tracking-wider">
          <div class="flex items-center gap-3">
            <span>每页显示</span>
            <select x-model.number="pageSize" @change="currentPage = 1" class="bg-cyber-panel2 border border-cyber-line rounded-sm text-cyber-text px-2 py-1 outline-none cursor-pointer focus:border-cyber-cyan">
              <option value="12">12</option>
              <option value="24">24</option>
              <option value="48">48</option>
            </select>
            <span>条，共 <b x-text="totalSites" class="text-cyber-cyan"></b> 条结果</span>
          </div>

          <div class="flex items-center gap-1">
            <button @click="changePage(currentPage - 1)" :disabled="currentPage === 1" class="px-2.5 py-1 border border-cyber-line rounded-sm hover:border-cyber-cyan/50 hover:bg-cyber-cyan/10 hover:text-cyber-cyan disabled:opacity-30 disabled:pointer-events-none transition-all">&lt; PREV</button>
            <template x-for="p in totalPages" :key="p">
              <button x-show="p === 1 || p === totalPages || Math.abs(p - currentPage) <= 1" @click="changePage(p)" :class="currentPage === p ? 'bg-cyber-cyan text-[#02181a] font-bold border-cyber-cyan shadow-[0_0_10px_rgba(0,240,255,0.3)]' : 'border-transparent text-cyber-dim hover:bg-white/5 hover:text-cyber-text'" class="w-7 h-7 flex items-center justify-center border rounded-sm transition-all" x-text="p"></button>
            </template>
            <button @click="changePage(currentPage + 1)" :disabled="currentPage === totalPages" class="px-2.5 py-1 border border-cyber-line rounded-sm hover:border-cyber-cyan/50 hover:bg-cyber-cyan/10 hover:text-cyber-cyan disabled:opacity-30 disabled:pointer-events-none transition-all">NEXT &gt;</button>
          </div>
        </div>
      </div>

      <footer class="mt-auto pt-8 flex justify-between items-center flex-wrap gap-4 font-mono text-[10px] tracking-widest text-cyber-dim2 shrink-0">
        <div class="flex items-center gap-2">
          <div class="w-1.5 h-1.5 rounded-full bg-cyber-cyan shadow-[0_0_8px_#00f0ff]"></div>
          ASSET//HUB · v22
        </div>
        <div class="flex items-center gap-4">
          <button @click="openCmdPalette('help')" class="flex items-center gap-1.5 hover:text-cyber-cyan transition-colors">
            <span class="border border-cyber-line2 rounded-sm px-1 bg-cyber-panel2 text-cyber-dim">?</span> 快捷键
          </button>
        </div>
      </footer>
    </main>
  </div>

  <!-- 万能命令面板 -->
  <div x-show="showCmdPalette" x-cloak class="fixed inset-0 z-[10000] flex items-start justify-center pt-[15vh] px-4 bg-[rgba(3,4,8,0.7)] backdrop-blur-sm transition-opacity" @click="showCmdPalette = false">
    <div @click.stop class="w-full max-w-[600px] bg-[rgba(12,14,23,0.95)] border border-cyber-cyan/40 rounded-md shadow-[0_0_50px_rgba(0,240,255,0.15),0_20px_60px_rgba(0,0,0,0.8)] overflow-hidden font-mono flex flex-col">

      <div class="flex items-center px-4 py-3 border-b border-cyber-line shrink-0">
        <svg class="w-5 h-5 text-cyber-cyan mr-3 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path x-show="cmdMode === 'cmd'" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          <circle x-show="cmdMode === 'help'" cx="12" cy="12" r="10"/><path x-show="cmdMode === 'help'" d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x-show="cmdMode === 'help'" x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <input x-ref="cmdInput" x-model="cmdSearch" type="text"
               :placeholder="cmdMode === 'help' ? '快捷键列表' : '输入搜索词或命令（输入 ? 查看快捷键）...'"
               :readonly="cmdMode === 'help'"
               @keydown.escape.prevent="showCmdPalette = false"
               @keydown.down.prevent="navigateCmd(1)"
               @keydown.up.prevent="navigateCmd(-1)"
               @keydown.enter.prevent="executeSelectedCmd()"
               @input="handleCmdInput"
               class="flex-1 bg-transparent border-none outline-none text-white text-[15px] tracking-wide placeholder:text-cyber-dim2 cursor-default focus:outline-none" autocomplete="off" spellcheck="false">
        <button @click="showCmdPalette = false" class="text-[10px] text-cyber-dim border border-cyber-line2 rounded-sm px-1.5 py-0.5 shrink-0 hover:text-cyber-magenta transition-colors">Esc</button>
      </div>

      <div class="max-h-[60vh] overflow-y-auto p-2">

        <template x-if="cmdMode === 'cmd'">
          <div>
            <div x-show="filteredCommands.length > 0" class="mb-2">
              <div class="text-[10px] text-cyber-dim tracking-widest px-2 py-1 uppercase">动作</div>
              <template x-for="(cmd, idx) in filteredCommands" :key="cmd.id">
                <div @click="executeCommand(cmd.action)"
                     :class="cmdActiveIndex === idx ? 'bg-cyber-cyan/10 border-cyber-cyan/30 text-cyber-cyan' : 'border-transparent text-cyber-text hover:bg-white/5'"
                     class="flex items-center gap-3 px-3 py-2.5 rounded-sm border cursor-pointer transition-colors"
                     @mouseenter="cmdActiveIndex = idx">
                  <div class="w-6 h-6 flex items-center justify-center rounded-sm bg-cyber-line/50 text-[10px] font-bold" x-text="cmd.icon"></div>
                  <span class="text-[13px]" x-text="cmd.label"></span>
                  <span x-show="cmd.shortcut" class="ml-auto text-[10px] text-cyber-dim2 border border-cyber-line px-1 rounded-sm" x-text="cmd.shortcut"></span>
                </div>
              </template>
            </div>

            <div x-show="cmdSearch.trim().length > 0 && filteredSitesForCmd.length > 0" class="mb-2">
              <div class="text-[10px] text-cyber-dim tracking-widest px-2 py-1 uppercase">站点搜索</div>
              <template x-for="(site, idx) in filteredSitesForCmd" :key="site.url">
                <div @click="executeCommand('openUrl', site.url)"
                     :class="cmdActiveIndex === (filteredCommands.length + idx) ? 'bg-cyber-cyan/10 border-cyber-cyan/30 text-cyber-cyan' : 'border-transparent text-cyber-text hover:bg-white/5'"
                     class="flex items-center justify-between px-3 py-2 rounded-sm border cursor-pointer transition-colors"
                     @mouseenter="cmdActiveIndex = filteredCommands.length + idx">
                  <div class="flex items-center gap-3">
                    <div class="w-6 h-6 flex items-center justify-center rounded-sm bg-cyber-magenta/10 text-cyber-magenta text-[10px]">🔗</div>
                    <span class="text-[13px]" x-text="site.name"></span>
                  </div>
                  <span class="text-[10px] text-cyber-dim" x-text="getDomain(site.url)"></span>
                </div>
              </template>
            </div>

            <div x-show="filteredCommands.length === 0 && filteredSitesForCmd.length === 0" class="py-10 text-center text-cyber-dim text-[12px]">
              没有找到相关命令或站点
            </div>
          </div>
        </template>

        <template x-if="cmdMode === 'help'">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-2 p-3">
            <div class="flex items-center justify-between py-1 border-b border-white/5"><span class="text-cyber-text text-[12px]">命令面板</span><kbd class="text-cyber-dim2 bg-cyber-panel2 border border-cyber-line2 rounded-sm px-1.5 py-0.5 text-[10px]">Ctrl + K</kbd></div>
            <div class="flex items-center justify-between py-1 border-b border-white/5"><span class="text-cyber-text text-[12px]">聚焦搜索</span><kbd class="text-cyber-dim2 bg-cyber-panel2 border border-cyber-line2 rounded-sm px-1.5 py-0.5 text-[10px]">/</kbd></div>
            <div class="flex items-center justify-between py-1 border-b border-white/5"><span class="text-cyber-text text-[12px]">随机打开</span><kbd class="text-cyber-dim2 bg-cyber-panel2 border border-cyber-line2 rounded-sm px-1.5 py-0.5 text-[10px]">R</kbd></div>
            <div class="flex items-center justify-between py-1 border-b border-white/5"><span class="text-cyber-text text-[12px]">网格视图</span><kbd class="text-cyber-dim2 bg-cyber-panel2 border border-cyber-line2 rounded-sm px-1.5 py-0.5 text-[10px]">G</kbd></div>

    const TYPE_LABEL     = { "2d":"2D 美术","3d":"3D 模型","audio":"音频","ui":"UI 界面","font":"字体","icon":"图标","texture":"纹理","palette":"调色板","vector":"矢量" };
    const LICENSE_LABEL  = { "cc0":"CC0","cc-by":"CC BY","free-commercial":"免费商用","mixed":"混合许可" };
    const REGISTER_LABEL = { "none":"免注册","optional":"可选注册","required":"需注册" };

    function assetHub() {
      return {
        sites: SITES,
        search: '',
        favOnly: false,
        showCmdPalette: false,
        cmdMode: 'cmd',
        cmdSearch: '',
        cmdActiveIndex: 0,
        favorites: JSON.parse(localStorage.getItem('ah_favs') || '[]'),
        recentSites: JSON.parse(localStorage.getItem('ah_recent') || '[]'),

        activeFilters: { types: [], licenses: [], registers: [] },
        sort: 'rec',
        view: 'grid',
        currentPage: 1,
        pageSize: 12,

        randomTimeout: null,

        contextMenu: { show: false, x: 0, y: 0, site: null },
        isDragging: false,
        draggedIndex: -1,
        customOrder: JSON.parse(localStorage.getItem('ah_custom_order') || '[]'),

        TYPE_LABEL, LICENSE_LABEL, REGISTER_LABEL,
        filterDefs: [
          { key: 'types', cn: '类型', opts: TYPE_LABEL },
          { key: 'licenses', cn: '许可', opts: LICENSE_LABEL },
          { key: 'registers', cn: '注册', opts: REGISTER_LABEL }
        ],

        commands: [
          { id: 'view-grid', label: '切换到网格视图', action: 'grid', icon: 'G', shortcut: 'G' },
          { id: 'view-list', label: '切换到列表视图', action: 'list', icon: 'L', shortcut: 'L' },
          { id: 'random', label: '随机打开一个站点', action: 'random', icon: '🎲', shortcut: 'R' },
          { id: 'toggle-fav', label: '切换只看收藏', action: 'fav', icon: '★' },
          { id: 'reset', label: '清空所有筛选和搜索', action: 'reset', icon: '×' },
          { id: 'preset-commercial', label: '应用预设：直接商用', action: 'preset-commercial', icon: '🚀' },
          { id: 'preset-2d', label: '应用预设：2D 美术', action: 'preset-2d', icon: '🎨' },
          { id: 'preset-audio', label: '应用预设：音频音效', action: 'preset-audio', icon: '🔊' },
        ],

        init() {
          const SEVEN_DAYS = 7 * 24 * 60 * 60 * 1000;
          const now = new Date().getTime();
          this.sites.forEach(site => {
            if (site.addedAt) {
              const addedTime = new Date(site.addedAt).getTime();
              site.isNew = (now - addedTime) < SEVEN_DAYS;
            } else {
              site.isNew = false;
            }
          });

          if (this.customOrder.length > 0) {
            this.sites.sort((a, b) => {
              const idxA = this.customOrder.indexOf(a.url);
              const idxB = this.customOrder.indexOf(b.url);
              if (idxA === -1 && idxB === -1) return 0;
              if (idxA === -1) return 1;
              if (idxB === -1) return -1;
              return idxA - idxB;
            });
          }

          this.parseHash();
          this.$watch('activeFilters', () => { this.currentPage = 1; this.syncHash(); }, { deep: true });
          this.$watch('search', () => { this.currentPage = 1; this.syncHash(); });
          this.$watch('favOnly', () => { this.currentPage = 1; this.syncHash(); });

          window.addEventListener('keydown', (e) => {
            const isTyping = ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName);

            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
              e.preventDefault();
              this.openCmdPalette('cmd');
              return;
            }

            if (this.showCmdPalette) {
              if (e.key === 'Escape') {
                e.preventDefault();
                this.showCmdPalette = false;
              }
              return;
            }

            if (e.key === '?' && !isTyping) {
              e.preventDefault();
              this.openCmdPalette('help');
              return;
            }

            if (e.key === '/' && !isTyping) { e.preventDefault(); this.$refs.searchInput.focus(); }
            if (e.key === 'Escape') {
              if (isTyping) document.activeElement.blur();
              if (this.search) this.search = '';
              else if (this.hasActiveFilters) this.resetAll();
              this.closeContextMenu();
            }
            if (e.key === 'Enter' && isTyping && document.activeElement.id === 'searchInput') {
              if (this.totalSites > 0) {
                this.toast('打开首个结果 · ' + this.filteredSites[0].name, 'ok');
                setTimeout(() => window.open(this.filteredSites[0].url, '_blank'), 300);
              }
            }
            if (e.key.toLowerCase() === 'r' && !isTyping && !e.repeat) this.openRandom();
            if (e.key.toLowerCase() === 'g' && !isTyping) this.view = 'grid';
            if (e.key.toLowerCase() === 'l' && !isTyping) this.view = 'list';
            if (e.key.toLowerCase() === 's' && !isTyping) this.favOnly = !this.favOnly;
          });

          // 兜底：只要用户在任何地方松开鼠标结束拖拽，立刻清理所有拖拽状态
          window.addEventListener('dragend', () => {
            this.isDragging = false;
            this.draggedIndex = -1;
            document.querySelectorAll('.is-dragging').forEach(el => el.classList.remove('is-dragging'));
            document.querySelectorAll('.drag-target').forEach(el => el.classList.remove('drag-target'));
          });
        },

        // 新增：计算属性判断当前是否允许拖拽
        get isDragEnabled() {
          return this.sort === 'rec' && !this.search && !this.hasActiveFilters;
        },

        // ==========================================
        // 🚀 拖拽排序逻辑 (视觉与交互优化)
        // ==========================================
        handleDragStart(e, i) {
          if (!this.isDragEnabled) {
            e.preventDefault();
            return;
          }
          this.isDragging = true;
          this.draggedIndex = i;
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', i);

          setTimeout(() => e.target.classList.add('is-dragging'), 0);
        },

        handleDragEnd(e) {
          this.isDragging = false;
          e.target.classList.remove('is-dragging');
          document.querySelectorAll('.drag-target').forEach(el => el.classList.remove('drag-target'));
        },

        handleDragOver(e, i) {
          if (!this.isDragging || this.draggedIndex === i) return;
          e.currentTarget.classList.add('drag-target');
        },

        handleDragLeave(e) {
          e.currentTarget.classList.remove('drag-target');
        },

        handleDrop(e, targetIndex) {
          e.currentTarget.classList.remove('drag-target');
          if (!this.isDragging || this.draggedIndex === -1 || this.draggedIndex === targetIndex) return;

          let currentList = [...this.displayedSites];
          const startIdx = this.draggedIndex;

          const item = currentList.splice(startIdx, 1)[0];
          currentList.splice(targetIndex, 0, item);

          const newGlobalOrder = [...this.customOrder];
          if (newGlobalOrder.length === 0) {
            this.sites.forEach(s => newGlobalOrder.push(s.url));
          }

          const pageStartOffset = (this.currentPage - 1) * this.pageSize;
          currentList.forEach((site, idx) => {
            const globalIdx = newGlobalOrder.indexOf(site.url);
            const tIdx = pageStartOffset + idx;
            if (globalIdx !== -1 && tIdx < newGlobalOrder.length) {
              const tmp = newGlobalOrder[tIdx];
              newGlobalOrder[tIdx] = newGlobalOrder[globalIdx];
              newGlobalOrder[globalIdx] = tmp;
            }
          });

          this.customOrder = newGlobalOrder;
          localStorage.setItem('ah_custom_order', JSON.stringify(this.customOrder));

          this.sites.sort((a, b) => {
            return this.customOrder.indexOf(a.url) - this.customOrder.indexOf(b.url);
          });

          this.toast('自定义排序已保存', 'ok');
        },

        // 新增：清理拖拽状态的方法，用于切换视图或排序时
        clearDragState() {
          this.isDragging = false;
          this.draggedIndex = -1;
          document.querySelectorAll('.is-dragging').forEach(el => el.classList.remove('is-dragging'));
          document.querySelectorAll('.drag-target').forEach(el => el.classList.remove('drag-target'));
        },

        // ==========================================
        // 🚀 右键菜单逻辑
        // ==========================================
        openContextMenu(e, site) {
          const menuWidth = 208; // w-52
          const menuHeight = 160;

          let x = e.clientX || (e.touches && e.touches[0] && e.touches[0].clientX) || 0;
          let y = e.clientY || (e.touches && e.touches[0] && e.touches[0].clientY) || 0;

          if (x + menuWidth > window.innerWidth) x -= menuWidth;
          if (y + menuHeight > window.innerHeight) y -= menuHeight;

          this.contextMenu = { show: true, x, y, site };
        },

        closeContextMenu() {
          if (this.contextMenu.show) {
            this.contextMenu.show = false;
          }
        },

        executeContextAction(action) {
          const site = this.contextMenu.site;
          if (!site) return;
          this.closeContextMenu();

          switch (action) {
            case 'open':
              this.addRecent(site);
              window.open(site.url, '_blank');
              break;
            case 'copy':
              this.copyText(site.url);
              break;
            case 'fav':
              this.toggleFav(site);
              break;
            case 'google':
              window.open(`https://www.google.com/search?q=${encodeURIComponent(site.name)}`, '_blank');
              break;
          }
        },

        openRandom() {
          if (this.randomTimeout) return;
          this.randomTimeout = setTimeout(() => { this.randomTimeout = null; }, 500);

          if (this.totalSites === 0) return this.toast('当前筛选结果为空', 'warn');

          const pick = this.filteredSites[Math.floor(Math.random() * this.filteredSites.length)];
          this.toast(`🎲 命中 · ${pick.name}`, 'ok');
          window.open(pick.url, '_blank');
        },

        // 下方逻辑保持不变...
        openCmdPalette(mode = 'cmd') { this.cmdMode = mode; this.showCmdPalette = true; this.cmdSearch = ''; this.cmdActiveIndex = 0; this.$nextTick(() => { if (this.$refs.cmdInput) this.$refs.cmdInput.focus(); }); },
        handleCmdInput(e) { if (this.cmdSearch.trim() === '?' || this.cmdSearch.trim().toLowerCase() === 'help') { this.cmdMode = 'help'; this.cmdSearch = ''; } },
        navigateCmd(dir) { if (this.cmdMode === 'help') return; const total = this.filteredCommands.length + this.filteredSitesForCmd.length; if (total === 0) return; this.cmdActiveIndex += dir; if (this.cmdActiveIndex < 0) this.cmdActiveIndex = total - 1; if (this.cmdActiveIndex >= total) this.cmdActiveIndex = 0; },
        executeSelectedCmd() { if (this.cmdMode === 'help') return; if (this.cmdActiveIndex < this.filteredCommands.length) { this.executeCommand(this.filteredCommands[this.cmdActiveIndex].action); } else { const siteIdx = this.cmdActiveIndex - this.filteredCommands.length; if (this.filteredSitesForCmd[siteIdx]) { this.executeCommand('openUrl', this.filteredSitesForCmd[siteIdx].url); } } },
        changePage(p) { if (p >= 1 && p <= this.totalPages) { this.currentPage = p; window.scrollTo({ top: 0, behavior: 'smooth' }); } },
        get totalSites() { return this.filteredSites.length; },
        get totalPages() { return Math.ceil(this.totalSites / this.pageSize) || 1; },

        syncHash() {
          const params = new URLSearchParams();
          if (this.search) params.set('q', this.search);
          if (this.favOnly) params.set('fav', '1');
          Object.entries(this.activeFilters).forEach(([key, arr]) => { if (arr.length > 0) params.set(key, arr.join(',')); });
          const newHash = params.toString();
          history.replaceState(null, '', newHash ? '#' + newHash : window.location.pathname + window.location.search);
        },

        parseHash() {
          const hash = window.location.hash.slice(1);
          if (!hash) return;
          const params = new URLSearchParams(hash);
          if (params.has('q')) this.search = params.get('q');
          if (params.has('fav')) this.favOnly = params.get('fav') === '1';
          ['types', 'licenses', 'registers'].forEach(key => {
            if (params.has(key)) this.activeFilters[key] = params.get(key).split(',');
          });
        },

        applyPreset(preset) {
          this.resetAll();
          if (preset.type) this.activeFilters.types = [...preset.type];
          if (preset.lic) this.activeFilters.licenses = [...preset.lic];
          if (preset.reg) this.activeFilters.registers = [...preset.reg];
          this.toast('已应用快捷预设', 'ok');
        },

        get filteredSites() {
          const queryParts = this.search.toLowerCase().split(/\s+/).filter(Boolean);

          let results = this.sites.filter(site => {
            if (this.favOnly && !this.favorites.includes(site.url)) return false;
            if (this.activeFilters.types.length > 0 && !site.types.some(t => this.activeFilters.types.includes(t))) return false;
            if (this.activeFilters.licenses.length > 0 && !this.activeFilters.licenses.includes(site.license)) return false;
            if (this.activeFilters.registers.length > 0 && !this.activeFilters.registers.includes(site.register)) return false;

            if (queryParts.length > 0) {
              const haystack = `${site.name} ${site.desc} ${site.tags.join(' ')} ${site.url}`.toLowerCase();
              if (!queryParts.every(part => haystack.includes(part))) return false;
            }
            return true;
          });

          if (queryParts.length > 0) {
            results = results.map(site => {
              let score = 0;
              const nameStr = site.name.toLowerCase();
              const tagsStr = site.tags.join(' ').toLowerCase();
              const descStr = site.desc.toLowerCase();

              queryParts.forEach(part => {
                if (nameStr === part) score += 50;
                else if (nameStr.includes(part)) score += 20;
                if (tagsStr.includes(part)) score += 10;
                if (descStr.includes(part)) score += 2;
              });
              return { site, score };
            }).sort((a, b) => b.score - a.score).map(item => item.site);
          } else {
            // 修复：A-Z 排序优先级最高，不被 customOrder 覆盖
            if (this.sort === 'az') {
              results.sort((a, b) => a.name.localeCompare(b.name));
            } else if (this.sort === 'rec') {
              if (this.customOrder.length > 0) {
                results.sort((a, b) => {
                  const idxA = this.customOrder.indexOf(a.url);
                  const idxB = this.customOrder.indexOf(b.url);
                  if (idxA === -1 && idxB === -1) return 0;
                  if (idxA === -1) return 1;
                  if (idxB === -1) return -1;
                  return idxA - idxB;
                });
              } else {
                results.sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0) || a.name.localeCompare(b.name));
              }
            }
          }

          return results;
        },

        get displayedSites() { const start = (this.currentPage - 1) * this.pageSize; return this.filteredSites.slice(start, start + this.pageSize); },
        get hasActiveFilters() { return this.search || this.favOnly || Object.values(this.activeFilters).some(arr => arr.length > 0); },
        get filteredCommands() { if (!this.cmdSearch.trim()) return this.commands; const q = this.cmdSearch.toLowerCase(); return this.commands.filter(c => c.label.toLowerCase().includes(q)); },
        get filteredSitesForCmd() { if (!this.cmdSearch.trim()) return []; const q = this.cmdSearch.toLowerCase(); return this.sites.filter(s => s.name.toLowerCase().includes(q) || s.tags.join(' ').toLowerCase().includes(q)).slice(0, 5); },

        executeCommand(action, payload) {
          this.showCmdPalette = false;
          switch (action) {
            case 'grid': this.view = 'grid'; this.clearDragState(); this.toast('已切换到网格视图'); break;
            case 'list': this.view = 'list'; this.clearDragState(); this.toast('已切换到列表视图'); break;
            case 'random': this.openRandom(); break;
            case 'fav': this.favOnly = !this.favOnly; break;
            case 'reset': this.resetAll(); break;
            case 'preset-commercial': this.applyPreset({ lic: ['cc0','free-commercial'], reg: ['none'] }); break;
            case 'preset-2d': this.applyPreset({ type: ['2d'] }); break;
            case 'preset-audio': this.applyPreset({ type: ['audio'] }); break;
            case 'openUrl': window.open(payload, '_blank'); break;
          }
        },

        toggleFilter(group, val) { const arr = this.activeFilters[group]; const index = arr.indexOf(val); if (index > -1) arr.splice(index, 1); else arr.push(val); this.clearDragState(); },
        getCount(group, val) { if (group === 'types') return this.sites.filter(s => s.types.includes(val)).length; if (group === 'licenses') return this.sites.filter(s => s.license === val).length; if (group === 'registers') return this.sites.filter(s => s.register === val).length; return 0; },
        getLabel(group, val) { if (group === 'types') return TYPE_LABEL[val]; if (group === 'licenses') return LICENSE_LABEL[val]; if (group === 'registers') return REGISTER_LABEL[val]; return val; },
        resetAll() { this.search = ''; this.favOnly = false; this.activeFilters = { types: [], licenses: [], registers: [] }; this.currentPage = 1; this.clearDragState(); },
        toggleFav(site) { const index = this.favorites.indexOf(site.url); if (index > -1) { this.favorites.splice(index, 1); this.toast(`已取消收藏 · ${site.name}`, 'warn'); } else { this.favorites.push(site.url); this.toast(`已收藏 · ${site.name}`, 'ok'); } localStorage.setItem('ah_favs', JSON.stringify(this.favorites)); },
        addRecent(site) { this.recentSites = this.recentSites.filter(s => s.url !== site.url); this.recentSites.unshift({ name: site.name, url: site.url }); if (this.recentSites.length > 5) this.recentSites.pop(); localStorage.setItem('ah_recent', JSON.stringify(this.recentSites)); },
        clearRecent() { this.recentSites = []; localStorage.setItem('ah_recent', '[]'); this.toast('已清空最近访问', 'ok'); },
        copyAll() { if (this.totalSites === 0) return this.toast('当前结果为空', 'warn'); const text = this.filteredSites.map(s => s.url).join('\n'); this.copyText(text, `已复制全部 ${this.totalSites} 条链接`); },
        copyText(text, successMsg = '已复制') { if (navigator.clipboard) { navigator.clipboard.writeText(text).then(() => this.toast(successMsg, 'ok')); } else { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); this.toast(successMsg, 'ok'); } },
        getDomain(url) { try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return url; } },
        highlight(text) { const esc = String(text).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); if (!this.search.trim()) return esc; try { const queryParts = this.search.split(/\s+/).filter(Boolean); if (queryParts.length === 0) return esc; const escapedParts = queryParts.map(p => p.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).sort((a, b) => b.length - a.length); const re = new RegExp("(" + escapedParts.join("|") + ")", "gi"); return esc.replace(re, '<mark class="hl">$1</mark>'); } catch { return esc; } },
        toast(msg, type = 'ok') { window.dispatchEvent(new CustomEvent('toast', { detail: { msg, type } })); }
      }
    }
  </script>
</body>
